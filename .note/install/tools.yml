qemu-system:
  reference: https://www.qemu.org/
  note:
    1: qemu-system is an embrella package that contains all artchitecture-specific packages
    2: we can install qemu-system-x86 to save spaces (Note *the package name and executable name are diferent)
  install: |
    sudo apt update
    sudo apt install qemu-system-x86
    qemu-system-x86_64 --version

nasm:
  reference: https://www.nasm.us/
  install: |
    sudo apt update
    sudo apt install nasm
    nasm --version

build-essential:
  What is Included:
    gcc: The GNU C compiler
    g++: The GNU C++ compiler
    make: A tool to automate the compilation process
    libc6-dev: Standard C library development files and headers
    dpkg-dev: Tools to build Debian source packages
  install: |
    sudo apt update
    sudo apt install build-essential
    gcc --version

grub-mkrescue:
  note: It is utility of the GRUB bootloader package ecosystem
  install: |
    sudo apt install grub-common xorriso mtools
